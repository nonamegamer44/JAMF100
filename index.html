'use strict';const sections=[{"name": "Device Fundamentals", "topics": ["iOS and iPadOS Settings", "macOS System Settings", "Device Apps", "macOS Preferences"]}, {"name": "Jamf Pro Setup & Infrastructure", "topics": ["Mobile Device Management (MDM)", "Apple Services", "Introduction to Jamf Pro", "User Accounts and Groups", "Categories, Buildings, and Departments", "Automated Device Enrollment", "User-Initiated Enrollment"]}, {"name": "Jamf Pro Management", "topics": ["Simple Searches, Inventory, and Remote Commands", "Advanced Searches and Actions", "Device Groups", "Device Scope", "Configuration Profiles", "Blueprints", "Compliance Benchmarks", "App Management", "Software Updates"]}, {"name": "Policies & Scripts", "topics": ["Policy Overview", "Deploy a Policy", "Policies and Self Service", "Jamf Binary and Commands", "Scripting and Jamf Pro"]}];const lessons=[{"id": "1-1", "name": "iOS and iPadOS Settings", "pl": "Ustawienia iOS i iPadOS", "body": "Ustawienia → Ogólne → To urządzenie pokazują model i wersję systemu. VPN i zarządzanie urządzeniem służy do przeglądania konfiguracji zarządzania.", "task": "Na iPadzie testowym znajdź numer seryjny, wersję iPadOS i sekcję zarządzania.", "section": "Device Fundamentals", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Apple: ustawienia urządzeń iOS/iPadOS"}, {"id": "1-2", "name": "macOS System Settings", "pl": "Ustawienia systemowe macOS", "body": "W Ustawieniach systemowych sprawdzisz wersję macOS, aktualizacje, prywatność i zabezpieczenia. FileVault szyfruje dane na dysku Maca.", "task": "Znajdź wersję macOS, status FileVault oraz aktualizacje bez zmieniania konfiguracji firmowej.", "section": "Device Fundamentals", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Apple: macOS User Guide"}, {"id": "1-3", "name": "Device Apps", "pl": "Aplikacje na urządzeniach Apple", "body": "Aplikacje mogą pochodzić z App Store lub zatwierdzonych źródeł. W organizacji dystrybucja aplikacji może być zarządzana przez MDM.", "task": "Porównaj instalację aplikacji ze sklepu i wdrożenie zarządzane.", "section": "Device Fundamentals", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Apple: deployment apps"}, {"id": "1-4", "name": "macOS Preferences", "pl": "Preferencje aplikacji macOS", "body": "Ustawienia aplikacji i uprawnienia prywatności wpływają na ich działanie. Dostęp do kamery, mikrofonu i plików wymaga odpowiednich zezwoleń.", "task": "Sprawdź uprawnienia wybranej aplikacji w Prywatność i ochrona.", "section": "Device Fundamentals", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Apple: privacy controls"}, {"id": "2-1", "name": "Mobile Device Management (MDM)", "pl": "Podstawy MDM", "body": "MDM pozwala zarządzać zarejestrowanymi urządzeniami: wysyłać konfiguracje, zapytania i polecenia. Zakres możliwości zależy od typu rejestracji i nadzoru.", "task": "Narysuj drogę polecenia MDM od konsoli do urządzenia i wyjaśnij rolę APNs.", "section": "Jamf Pro Setup & Infrastructure", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Apple: intro device management"}, {"id": "2-2", "name": "Apple Services", "pl": "Usługi Apple dla IT", "body": "Apple Business i usługi Apple wspierają rejestrację i dystrybucję aplikacji. APNs powiadamia urządzenie o konieczności kontaktu z serwerem MDM; nie przechowuje pełnej konfiguracji.", "task": "Wypisz wymagane elementy komunikacji MDM i sprawdź, co się stanie po wygaśnięciu certyfikatu APNs.", "section": "Jamf Pro Setup & Infrastructure", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Apple: APNs"}, {"id": "2-3", "name": "Introduction to Jamf Pro", "pl": "Wprowadzenie do Jamf Pro", "body": "Jamf Pro jest platformą do zarządzania urządzeniami Apple. Konsola zawiera obszary Computers, Devices i Users oraz dashboard z informacjami o środowisku.", "task": "W środowisku demonstracyjnym wskaż, gdzie znajdziesz rekord komputera i urządzenia mobilnego.", "section": "Jamf Pro Setup & Infrastructure", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 7"}, {"id": "2-4", "name": "User Accounts and Groups", "pl": "Konta i grupy użytkowników", "body": "Konta administracyjne i grupy służą do kontroli dostępu do funkcji Jamf Pro. Przydzielaj uprawnienia zgodnie z zasadą najmniejszych uprawnień.", "task": "Zaprojektuj rolę help desk z dostępem do odczytu inwentarza, bez uprawnienia do usuwania urządzeń.", "section": "Jamf Pro Setup & Infrastructure", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 8"}, {"id": "2-5", "name": "Categories, Buildings, and Departments", "pl": "Kategorie, budynki i działy", "body": "Kategorie ułatwiają porządkowanie obiektów Jamf Pro, a budynki i działy opisują strukturę organizacyjną przypisaną do rekordów.", "task": "Zaproponuj strukturę działów i budynków dla firmy z trzema biurami.", "section": "Jamf Pro Setup & Infrastructure", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 9"}, {"id": "2-6", "name": "Automated Device Enrollment", "pl": "Automatyczna rejestracja ADE", "body": "ADE umożliwia organizacjom automatyczne podłączenie przypisanych urządzeń do MDM podczas konfiguracji początkowej. W Jamf Pro ustawienia rejestracji przygotowuje się m.in. za pomocą PreStage Enrollment.", "task": "Opisz kroki od przypisania Maca w Apple Business do ekranu Remote Management podczas Setup Assistant.", "section": "Jamf Pro Setup & Infrastructure", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Apple: ADE"}, {"id": "2-7", "name": "User-Initiated Enrollment", "pl": "Rejestracja inicjowana przez użytkownika", "body": "User-initiated enrollment rozpoczyna użytkownik, np. przez portal rejestracyjny. Nie jest to to samo co ADE; uprawnienia zarządzania zależą od metody i systemu.", "task": "Porównaj ADE i rejestrację ręczną pod kątem momentu wdrożenia i możliwości usunięcia profilu.", "section": "Jamf Pro Setup & Infrastructure", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 11"}, {"id": "3-1", "name": "Simple Searches, Inventory, and Remote Commands", "pl": "Inwentarz i polecenia zdalne", "body": "Rekord inwentarzowy pokazuje informacje o zarządzanym urządzeniu. Wyszukiwanie proste pozwala odnaleźć rekord, a dostępne polecenia zdalne zależą od platformy i uprawnień.", "task": "Znajdź urządzenie po numerze seryjnym i wskaż datę ostatniej aktualizacji inwentarza.", "section": "Jamf Pro Management", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 12"}, {"id": "3-2", "name": "Advanced Searches and Actions", "pl": "Wyszukiwanie zaawansowane", "body": "Advanced Search filtruje rekordy według kryteriów i może służyć do raportowania. Kryteria dobieraj tak, by wyniki były jednoznaczne.", "task": "Zaprojektuj wyszukiwanie Maców z nieaktualnym systemem i wyeksportuj wymagane pola.", "section": "Jamf Pro Management", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 13"}, {"id": "3-3", "name": "Device Groups", "pl": "Grupy statyczne i inteligentne", "body": "Static Groups mają ręcznie określone członkostwo. Smart Groups przeliczają skład na podstawie kryteriów inwentarza; mogą być używane do scope wdrożeń.", "task": "Utwórz koncepcję Smart Group: Mac bez włączonego FileVault.", "section": "Jamf Pro Management", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 14 / Smart Groups"}, {"id": "3-4", "name": "Device Scope", "pl": "Zakres wdrożenia (Scope)", "body": "Scope wskazuje urządzenia lub użytkowników objętych obiektem zarządzania. Zanim wdrożysz zmianę, przetestuj kryteria, wykluczenia i docelową grupę.", "task": "Zaprojektuj wdrożenie profilu tylko do pięciu Maców testowych.", "section": "Jamf Pro Management", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 15"}, {"id": "3-5", "name": "Configuration Profiles", "pl": "Profile konfiguracyjne", "body": "Profile i konfiguracje pozwalają narzucać ustawienia, np. Wi‑Fi, ograniczenia lub politykę bezpieczeństwa. Dostępność ustawień zależy od systemu i sposobu zarządzania.", "task": "Opisz profil Wi‑Fi i zasady bezpiecznego testowania przed wdrożeniem produkcyjnym.", "section": "Jamf Pro Management", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 16"}, {"id": "3-6", "name": "Blueprints", "pl": "Blueprints", "body": "Blueprints grupują konfiguracje i działania zarządzania w obsługiwanych przepływach Jamf Pro. Sprawdź wersję i dostępność funkcji przed wdrożeniem.", "task": "Zaplanuj zestaw ustawień dla nowych komputerów testowych.", "section": "Jamf Pro Management", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 17"}, {"id": "3-7", "name": "Compliance Benchmarks", "pl": "Wzorce zgodności", "body": "Compliance benchmarks pomagają oceniać konfigurację urządzeń względem przyjętych standardów bezpieczeństwa. Wynik oceny nie zastępuje analizy ryzyka.", "task": "Zapisz trzy ustawienia bezpieczeństwa do sprawdzenia na firmowym Macu.", "section": "Jamf Pro Management", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 18"}, {"id": "3-8", "name": "App Management", "pl": "Zarządzanie aplikacjami", "body": "Jamf Pro wspiera dystrybucję i zarządzanie aplikacjami. Metoda zależy od typu urządzenia, licencji i sposobu pozyskania aplikacji.", "task": "Rozpisz wdrożenie jednej aplikacji dla działu IT z pilotażem.", "section": "Jamf Pro Management", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 19"}, {"id": "3-9", "name": "Software Updates", "pl": "Aktualizacje systemów", "body": "Aktualizacje systemów można planować i nadzorować z uwzględnieniem zgodności, terminu i dostępności urządzeń. Nie każda metoda działa identycznie na wszystkich wersjach systemu.", "task": "Przygotuj plan aktualizacji 20 Maców z grupą pilotażową.", "section": "Jamf Pro Management", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 20"}, {"id": "4-1", "name": "Policy Overview", "pl": "Podstawy polityk", "body": "Polityki Jamf Pro wykonują zadania na zarządzanych Macach. Ważne elementy to trigger, frequency, scope oraz payload wykonywanego działania.", "task": "Wymień warunki, w których polityka instalacji oprogramowania powinna się uruchomić.", "section": "Policies & Scripts", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 21"}, {"id": "4-2", "name": "Deploy a Policy", "pl": "Wdrażanie polityki", "body": "Polityka powinna mieć jasno określony cel, trigger, częstotliwość oraz zakres. Przed wdrożeniem sprawdź logi i wynik na urządzeniu testowym.", "task": "Zaplanuj politykę instalacji zatwierdzonego pakietu na jednym Macu.", "section": "Policies & Scripts", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 22"}, {"id": "4-3", "name": "Policies and Self Service", "pl": "Polityki i Self Service", "body": "Self Service udostępnia użytkownikowi zatwierdzone przez IT działania i aplikacje. Widoczność elementu zależy od konfiguracji oraz zakresu.", "task": "Zaprojektuj pozycję Self Service do samodzielnej instalacji przeglądarki.", "section": "Policies & Scripts", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 23"}, {"id": "4-4", "name": "Jamf Binary and Commands", "pl": "Jamf binary i polecenia", "body": "Narzędzie jamf na zarządzanym Macu może uruchamiać określone działania klienta. Używaj poleceń wyłącznie na autoryzowanych urządzeniach i dokumentuj ich skutki.", "task": "W terminalu środowiska testowego sprawdź dostępność jamf binary i jego pomoc.", "section": "Policies & Scripts", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 24"}, {"id": "4-5", "name": "Scripting and Jamf Pro", "pl": "Skrypty w Jamf Pro", "body": "Skrypty automatyzują zadania administracyjne. Należy walidować wejście, obsługiwać błędy i testować skrypty przed wdrożeniem.", "task": "Napisz pseudokod skryptu raportującego wersję macOS bez zmieniania systemu.", "section": "Policies & Scripts", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current", "reference": "Jamf: Lesson 25"}];const questions=[{"id": "lesson-1", "lesson": "1-1", "q": "Which statement best describes iOS and iPadOS Settings in the Jamf 100 learning path?", "pl": "Które stwierdzenie najlepiej opisuje temat: Ustawienia iOS i iPadOS?", "options": ["Ustawienia → Ogólne → To urządzenie pokazują model i wersję systemu. VPN i zarządzanie urządzeniem służy do przeglądania konfiguracji zarządzania.", "It is a tool used exclusively for manufacturing Apple hardware.", "It eliminates the need for device security controls.", "It always requires replacing macOS with another operating system."], "correct": 0, "explanation": "Ustawienia → Ogólne → To urządzenie pokazują model i wersję systemu. VPN i zarządzanie urządzeniem służy do przeglądania konfiguracji zarządzania.", "source": "https://learn.jamf.com/r/en-US/jamf-100-course-current"}, {"id": "lesson-2", "lesson": "1-2", "q": "Which statement best describes macOS System Settings in the Jamf 100 learning path?", "pl": "Które stwierdzenie najlepiej opisuje temat: Ustawienia systemowe macOS?", "options": ["W Ustawieniach systemowych sprawdzisz wersję macOS, aktualizacje, prywatność i zabezpieczenia. FileVault szyfruje dane na dysku Maca.", "It is a tool used exclusively for manufacturing Apple hardware.", "It eliminates the need for device security controls.", "It always requires replacing mac mf100academy-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}}state.completed??=[];state.history??=[];state.mistakes??=[];let page='dashboard',quiz=null,lang='en';function save(){localStorage.setItem(key,JSON.stringify(state))}function el(s){document.getElementById('app').innerHTML=s}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(){document.getElementById('menu').innerHTML=[['dashboard','⌂ Dashboard'],['lessons','▤ Lekcje'],['quiz','◉ Quiz'],['exam','✦ Egzamin'],['mistakes','↻ Moje błędy'],['sources','↗ Źródła']].map(([p,n])=>`<button class="nav ${page===p?'active':''}" data-page="${p}">${n}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}function go(p){page=p;nav();render()}function render(){if(page==='dashboard')dashboard();else if(page==='lessons')showLessons();else if(page==='quiz')quizHome();else if(page==='exam')examHome();else if(page==='mistakes')mistakes();else sources()}function dashboard(){const count=state.completed.length;const best=Math.max(0,...state.history.map(x=>x.percent));el(`<h1>Witaj w Jamf 100 Academy</h1><p>Twoje centrum nauki administracji urządzeniami Apple i Jamf Pro.</p><div class="notice"><b>Etap 4 — analityka, powtórki i laboratoria.</b> Program obejmuje 25 lekcji, autorskie skróty i 79 pytań treningowych. Nie jest to jeszcze pełny kurs ani miarodajny egzamin certyfikacyjny.</div><div class="grid"><div class="card">Ukończone tematy<div class="metric">${count}/${lessons.length}</div></div><div class="card">Najlepszy wynik<div class="metric">${best}%</div></div><div class="card">Podejścia do testów<div class="metric">${state.history.length}</div></div><div class="card">Pytania do powtórki<div class="metric">${state.mistakes.length}</div></div></div><h2>Postęp nauki</h2><div class="progress"><div style="width:${100*count/lessons.length}%"></div></div><p>${Math.round(100*count/lessons.length)}% tematów oznaczonych jako ukończone</p><div class="row"><button class="btn" onclick="go('lessons')">Przejdź do lekcji</button><button class="btn secondary" onclick="go('quiz')">Rozwiąż quiz</button></div>`)}function showLessons(){el(`<h1>Oficjalna ścieżka Jamf 100</h1><p>25 lekcji w czterech sekcjach. Autorskie streszczenia, zadania praktyczne i linki do oryginalnego kursu.</p>${sections.map((section,i)=>`<h2>${i+1}. ${esc(section.name)}</h2>${lessons.filter(l=>l.section===section.name).map(l=>`<div class="card lesson"><div><b>${esc(l.name)}</b><br><span class="muted">${esc(l.pl)} · ${state.completed.includes(l.id)?'✓ Ukończone':'Do nauki'}</span></div><button class="btn secondary" data-open="${l.id}">Otwórz lekcję</button></div>`).join('')}`).join('')}`);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openLesson(b.dataset.open))}function openLesson(id){const l=lessons.find(x=>x.id===id);if(!l)return;el(`<button class="btn secondary" onclick="go('lessons')">← Wszystkie lekcje</button><h1>${esc(l.name)}</h1><p>${esc(l.pl)} · ${esc(l.section)}</p><div class="card"><h2>Najważniejsze zagadnienia</h2><p>${esc(l.body)}</p><h2>Ćwiczenie praktyczne</h2><p>${esc(l.task)}</p><p class="muted">Materiał jest autorskim skrótem. W celu pełnego przygotowania zapoznaj się z oficjalną lekcją i demonstracją Jamf.</p><a href="${esc(l.source)}" target="_blank" rel="noopener">Oficjalny kurs Jamf 100 ↗</a><br><br><button class="btn" id="done">${state.completed.includes(id)?'Oznacz jako nieukończone':'Oznacz lekcję jako ukończoną'}</button> <button class="btn secondary" id="practice">Pytanie sprawdzające</button></div>`);document.getElementById('done').onclick=()=>{state.completed=state.completed.includes(id)?state.completed.filter(x=>x!==id):[...state.completed,id];save();openLesson(id)};document.getElementById('practice').onclick=()=>start(questions.filter(q=>q.lesson===id),'quiz')}function quizHome(){el(`<h1>Quiz tematyczny</h1><p>Wybierz obszar. Pytania i wyjaśnienia są po angielsku, z opcjonalnym polskim tłumaczeniem.</p><div class="card"><label for="topic">Obszar pytań</label><br><br><select id="topic"><option value="all">Wszystkie tematy (${questions.length})</option>${sections.map((s,i)=>`<option value="${i+1}">${esc(s.name)} (${questions.filter(q=>q.lesson.startsWith((i+1)+'-')).length})</option>`).join('')}</select><br><br><button class="btn" id="startQuiz">Rozpocznij quiz</button></div>`);document.getElementById('startQuiz').onclick=()=>{let t=document.getElementById('topic').value;start(t==='all'?questions:questions.filter(q=>q.lesson.startsWith(t+'-')),'quiz')}}function examHome(){el(`<h1>Symulator egzaminu</h1><div class="notice">Autorski trening egzaminacyjny: losowe 50 pytań, limit 60 minut, próg treningowy 80%. Nie są to oficjalne pytania Jamf, a wynik nie gwarantuje zdania certyfikacji.</div><p>W tym trybie otrzymasz podsumowanie po zakończeniu testu. Limit 60 minut.</p><button class="btn" id="startExam">Uruchom egzamin treningowy</button>`);document.getElementById('startExam').onclick=()=>start([...questions].sort(()=>Math.random()-.5).slice(0,50),'exam')}function mistakes(){let list=questions.filter(q=>state.mistakes.includes(q.id));el(`<h1>Moje błędy</h1><p>Lista pytań, na które udzielono błędnej odpowiedzi.</p>${list.length?`<div class="card"><p>${list.length} pytań do powtórki</p><button class="btn" id="retry">Powtórz błędy</button></div>`:'<div class="card">Nie masz jeszcze pytań do powtórki.</div>'}`);if(list.length)document.getElementById('retry').onclick=()=>start(list,'quiz')}function sources(){el(`<h1>Oficjalne źródła</h1><p>Materiały referencyjne do dalszego opracowania treści. Pytania demonstracyjne są autorskie.</p><div class="card"><p><a href="https://learn.jamf.com/" target="_blank" rel="noopener">Jamf Learning Hub</a></p><p><a href="https://learn.jamf.com/r/en-US/jamf-100-course-current" target="_blank" rel="noopener">Jamf 100 Course</a></p><p><a href="https://support.apple.com/guide/deployment/welcome/web" target="_blank" rel="noopener">Apple Platform Deployment</a></p><p><a href="https://support.apple.com/guide/deployment/intro-to-device-management-depc0aadd3fe/web" target="_blank" rel="noopener">Apple — Introduction to MDM</a></p></div>`)}function start(qs,mode){if(!qs.length){alert('Brak pytań w tym obszarze.');return}quiz={qs:[...qs].sort(()=>Math.random()-.5),mode,index:0,answers:[],started:Date.now(),deadline:mode==='exam'?Date.now()+3600000:null,selected:null};drawQuestion()}function drawQuestion(){if(quiz.deadline&&Date.now()>=quiz.deadline){finish();return}let q=quiz.qs[quiz.index],answered=quiz.answers[quiz.index]!==undefined;el(`<div class="row" style="justify-content:space-between"><h1>${quiz.mode==='exam'?'Egzamin treningowy (50 pytań / 60 min)':'Quiz'}</h1><span class="tag">${quiz.index+1} / ${quiz.qs.length}</span></div><div class="progress"><div style="width:${100*(quiz.index+1)/quiz.qs.length}%"></div></div><div class="card" style="margin-top:22px"><div class="row" style="justify-content:space-between"><span class="tag">${esc(lessons.find(l=>l.id===q.lesson)?.name||'Jamf')}</span><button class="btn secondary" id="translate">${lang==='en'?'Pokaż tłumaczenie':'Hide translation'}</button></div><h2>${esc(q.q)}</h2>${lang==='pl'?`<p>${esc(q.pl)}</p>`:''}${q.options.map((o,i)=>`<button class="answer ${answered?(i===q.correct?'correct':quiz.answers[quiz.index]===i?'wrong':''):quiz.selected===i?'selected':''}" data-a="${i}" ${answered?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}${answered&&quiz.mode!=='exam'?`<div class="feedback"><b>${quiz.answers[quiz.index]===q.correct?'✓ Poprawnie':'✕ Niepoprawnie'}</b><p>${esc(q.explanation)}</p><a href="${esc(q.source)}" target="_blank" rel="noopener">Źródło / dokumentacja ↗</a></div>`:''}<div class="row"><button class="btn" id="next" ${!answered&&quiz.selected===null?'disabled':''}>${answered?(quiz.index===quiz.qs.length-1?'Zakończ':'Następne pytanie'):'Zatwierdź odpowiedź'}</button></div></div>`);document.getElementById('translate').onclick=()=>{lang=lang==='en'?'pl':'en';drawQuestion()};document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{quiz.selected=Number(b.dataset.a);drawQuestion()});document.getElementById('next').onclick=()=>{if(!answered){quiz.answers[quiz.index]=quiz.selected;if(quiz.mode==='exam'){if(quiz.index===quiz.qs.length-1)finish();else{quiz.index++;quiz.selected=null;drawQuestion()}}else drawQuestion()}else if(quiz.index===quiz.qs.length-1)finish();else{quiz.index++;quiz.selected=null;drawQuestion()}}}function finish(){if(!quiz)return;let correct=quiz.qs.filter((q,i)=>quiz.answers[i]===q.correct).length;let percent=Math.round(correct/quiz.qs.length*100);for(let i=0;i<quiz.qs.length;i++){let q=quiz.qs[i];if(quiz.answers[i]!==q.correct){if(!state.mistakes.includes(q.id))state.mistakes.push(q.id)}else state.mistakes=state.mistakes.filter(id=>id!==q.id)}state.history.push({date:new Date().toISOString(),mode:quiz.mode,correct,total:quiz.qs.length,percent});save();el(`<h1>Wynik: ${percent}%</h1><div class="card"><div class="metric">${correct} / ${quiz.qs.length}</div><p>Poprawne odpowiedzi · czas: ${Math.max(1,Math.ceil((Date.now()-quiz.started)/60000))} min</p><p>To wynik autorskiego treningu, nie oficjalnego egzaminu Jamf.</p><button class="btn" onclick="go('dashboard')">Dashboard</button> <button class="btn secondary" onclick="go('mistakes')">Powtórz błędy</button></div>${quiz.qs.map((q,i)=>`<div class="card" style="margin-top:12px"><b>${i+1}. ${esc(q.q)}</b><p>${quiz.answers[i]===q.correct?'✓':'✕'} Twoja odpowiedź: ${esc(q.options[quiz.answers[i]] ?? "Brak odpowiedzi")}</p><p>Poprawna: ${esc(q.options[q.correct])}</p><p>${esc(q.explanation)}</p><a href="${esc(q.source)}" target="_blank" rel="noopener">Źródło ↗</a></div>`).join('')}`)}nav();render();setInterval(()=>{if(quiz&&quiz.deadline&&Date.now()>=quiz.deadline&&document.getElementById('next'))finish()},1000);

lessons.forEach((l,i)=>{l.body += "\n\nWskazówka operacyjna: " + ["Sprawdź również nadzór urządzenia (supervision) i typ rejestracji.", "Nie zmieniaj ustawień bezpieczeństwa na firmowym Macu bez zgody.", "Zarządzana instalacja i licencjonowanie to osobne kwestie.", "Odmowa dostępu do mikrofonu lub kamery często wynika z uprawnień prywatności.", "APNs służy do sygnalizacji, a właściwe polecenie jest pobierane z MDM.", "Odnowienie certyfikatu APNs powinno zachować jego tożsamość.", "Weryfikuj rekord inwentarzowy i uprawnienia operatora.", "Zasada least privilege zmniejsza ryzyko przypadkowych zmian.", "Kategorie służą do organizacji obiektów, budynki i działy opisują organizację.", "ADE wymaga poprawnego przypisania urządzenia i konfiguracji rejestracji.", "Metoda enrollment wpływa na dostępne funkcje i możliwość usunięcia zarządzania.", "Informacje w inwentarzu mogą wymagać odświeżenia.", "Filtry przetestuj na małej grupie przed wykorzystaniem w scope.", "Smart Group zależy od aktualności danych inwentarzowych.", "Scope i exclusions przejrzyj przed produkcyjnym wdrożeniem.", "Obsługa payloadów zależy od platformy i wersji systemu.", "Sprawdź dostępność funkcji w używanej wersji Jamf.", "Benchmark jest punktem odniesienia, nie gwarancją bezpieczeństwa.", "Sprawdź licencje, zgodność aplikacji i grupę pilotażową.", "Wdrażaj aktualizacje etapami, z planem komunikacji i wycofania.", "Polityka wymaga odpowiedniego triggera, frequency i scope.", "Logi polityki pomagają weryfikować jej wykonanie.", "Self Service powinien pokazywać tylko odpowiednie zadania.", "Przed poleceniami CLI zapoznaj się z dokumentacją i skutkami.", "Skrypty testuj na sprzęcie laboratoryjnym; nie przechowuj w nich haseł."][i]});
</script><style>
.statbar{height:10px;background:#202c47;border-radius:12px;overflow:hidden;margin:8px 0 16px}.statbar>div{height:100%;background:#63b5fa}.small{font-size:.87rem;opacity:.8}.labstep{padding:12px 0;border-bottom:1px solid #35425c}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
</style><script>
(function(){
const extra=[['analytics','▥ Analiza wyników'],['review','◷ Inteligentne powtórki'],['labs','⌘ Laboratorium'],['backup','⇩ Kopia postępów']];
const oldNav=nav,oldRender=render,oldStart=start,oldFinish=finish;
const repKey='jamf100academy-review-v4';let rep={};try{rep=JSON.parse(localStorage.getItem(repKey))||{}}catch(e){};
function persist(){localStorage.setItem(repKey,JSON.stringify(rep))}
function due(q){return !rep[q.id]||rep[q.id].due<=Date.now()}
function interval(q,ok){let r=rep[q.id]||{streak:0};r.streak=ok?r.streak+1:0;let days=ok?([1,3,7,14,30][Math.min(r.streak-1,4)]):0;rep[q.id]={streak:r.streak,due:Date.now()+(days?days*86400000:3600000),last:Date.now()};}
nav=function(){oldNav();document.getElementById('menu').insertAdjacentHTML('beforeend',extra.map(([p,n])=>`<button class="nav ${page===p?'active':''}" data-extra="${p}">${n}</button>`).join(''));document.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>go(b.dataset.extra));};
render=function(){if(page==='analytics')analytics();else if(page==='review')review();else if(page==='labs')labs();else if(page==='backup')backup();else oldRender()};
function analytics(){let rows=sections.map((sec,i)=>{let qs=questions.filter(q=>q.lesson.startsWith((i+1)+'-'));let known=qs.filter(q=>rep[q.id]&&rep[q.id].streak>0).length;return {sec,qs,known}});let hist=state.history.slice(-12).reverse();el(`<h1>Analiza wyników</h1><p>Opanowanie obszarów liczone na podstawie poprawnych odpowiedzi w ostatnich sesjach; nie jest miarą gotowości do certyfikacji.</p><div class="grid"><div class="card">Pytania w bazie<div class="metric">${questions.length}</div></div><div class="card">Pytania do powtórki<div class="metric">${questions.filter(due).length}</div></div><div class="card">Ukończone lekcje<div class="metric">${state.completed.length}/25</div></div></div><h2>Opanowanie obszarów</h2>${rows.map(r=>`<div class="card"><b>${esc(r.sec.name)}</b><span class="small"> — ${r.known}/${r.qs.length} ostatnio poprawnych</span><div class="statbar"><div style="width:${Math.round(r.known/Math.max(1,r.qs.length)*100)}%"></div></div></div>`).join('')}<h2>Historia podejść</h2>${hist.length?hist.map(h=>`<div class="card">${esc(new Date(h.date).toLocaleString('pl-PL'))} · ${esc(h.mode)} · <b>${h.percent}%</b> (${h.correct}/${h.total})</div>`).join(''):'<div class="card">Brak zapisanych podejść.</div>'}`)}
function review(){let qs=questions.filter(due);el(`<h1>Inteligentne powtórki</h1><div class="notice">Prosty system odstępów: po kolejnych poprawnych odpowiedziach powrót po 1, 3, 7, 14 i 30 dniach; po błędzie powtórka po godzinie. Nowe pytania są dostępne od razu.</div><div class="card"><div class="metric">${qs.length}</div><p>Pytań dostępnych do powtórki</p><button class="btn" id="beginReview" ${qs.length?'':'disabled'}>Rozpocznij 15 pytań</button></div>`);document.getElementById('beginReview').onclick=()=>oldStart(qs.slice(0,15),'quiz')}
const scenarios=[
{title:'ADE — Mac nie pokazuje Remote Management',context:'Nowy firmowy Mac uruchamia Setup Assistant, ale nie pokazuje ekranu Remote Management.',steps:['Sprawdź numer seryjny urządzenia w Apple Business Manager i jego przypisanie do serwera MDM.','Sprawdź synchronizację tokenu ADE i przypisanie urządzenia do PreStage w Jamf Pro.','Zweryfikuj połączenie internetowe i dostęp do usług aktywacji Apple.','Sprawdź, czy urządzenie rzeczywiście przeszło ponowną aktywację/konfigurację początkową.'],source:'https://support.apple.com/guide/deployment/welcome/web'},
{title:'APNs — urządzenia nie odbierają poleceń',context:'Kilka Maców ma rekordy w inwentarzu, ale nowe polecenia MDM nie są wykonywane.',steps:['Sprawdź ważność i tożsamość certyfikatu APNs w Jamf Pro.','Sprawdź łączność urządzeń z usługami Apple i serwerem MDM.','Porównaj zakres awarii: jedno urządzenie, sieć czy całe środowisko.','Nie wymieniaj certyfikatu APNs na nowy bez oceny skutków dla istniejącej rejestracji.'],source:'https://learn.jamf.com/'},
{title:'Smart Group — nieprawidłowy zakres wdrożenia',context:'Profil Wi-Fi trafia na urządzenia spoza pilotażu.',steps:['Zweryfikuj kryteria i operator logiczny Smart Group.','Sprawdź wykluczenia oraz scope profilu.','Porównaj aktualność danych inwentarzowych i przynależność urządzeń.','Przetestuj na małej grupie przed ponownym wdrożeniem.'],source:'https://learn.jamf.com/'},
{title:'FileVault — status niezgodny z oczekiwaniami',context:'W Jamf Pro urządzenie widnieje jako niezaszyfrowane, choć użytkownik twierdzi, że włączył FileVault.',steps:['Zweryfikuj lokalny stan FileVault na Macu bez ujawniania klucza odzyskiwania.','Sprawdź datę ostatniej aktualizacji inwentarza.','Sprawdź wymagania profilu i zakres przypisania.','Oceń stan escrow klucza odzyskiwania zgodnie z polityką organizacji.'],source:'https://support.apple.com/guide/deployment/welcome/web'}
];
function labs(){el(`<h1>Laboratorium IT Support / Jamf Pro</h1><p>Scenariusze diagnostyczne. Nie wykonuj destrukcyjnych operacji na urządzeniach produkcyjnych bez autoryzacji.</p>${scenarios.map((s,i)=>`<div class="card"><h2>${esc(s.title)}</h2><p>${esc(s.context)}</p><button class="btn secondary" data-lab="${i}">Pokaż checklistę</button><div id="lab-${i}" hidden>${s.steps.map((x,j)=>`<div class="labstep"><label><input type="checkbox"> ${j+1}. ${esc(x)}</label></div>`).join('')}<p><a href="${esc(s.source)}" target="_blank" rel="noopener">Dokumentacja ↗</a></p></div></div>`).join('')}`);document.querySelectorAll('[data-lab]').forEach(b=>b.onclick=()=>{let d=document.getElementById('lab-'+b.dataset.lab);d.hidden=!d.hidden})}
function backup(){el(`<h1>Kopia zapasowa postępów</h1><p>Dane są przechowywane lokalnie w tej przeglądarce. Eksport pozwala przenieść je na inne urządzenie. Nie umieszczaj pliku kopii w publicznym repozytorium.</p><div class="card toolbar"><button class="btn" id="export">Eksportuj JSON</button><label class="btn secondary" for="importfile">Importuj JSON</label><input type="file" id="importfile" accept=".json,application/json" style="display:none"></div>`);document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({format:'jamf100academy-backup-v4',state,rep},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='jamf100-postepy.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('importfile').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(obj.format!=='jamf100academy-backup-v4'||!Array.isArray(obj.state?.completed)||!Array.isArray(obj.state?.history)||!Array.isArray(obj.state?.mistakes)||!obj.rep||typeof obj.rep!=='object'||Array.isArray(obj.rep))throw Error('Nieprawidłowy format');if(!confirm('Zastąpić lokalne postępy danymi z kopii?'))return;state=obj.state;rep=obj.rep;save();persist();alert('Zaimportowano postępy');go('dashboard')}catch(err){alert('Nie udało się zaimportować: '+err.message)}}}
start=function(qs,mode){let shuffled=[...qs];for(let i=shuffled.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}oldStart(shuffled,mode)};
finish=function(){if(!quiz||quiz._finished)return;quiz._finished=true;quiz.qs.forEach((q,i)=>interval(q,quiz.answers[i]===q.correct));persist();oldFinish();quiz=null};
const oldDraw=drawQuestion;drawQuestion=function(){oldDraw();if(quiz?.mode==='exam'){let box=document.querySelector('#app .row');if(box){let t=document.createElement('span');t.id='clock';t.className='tag';box.appendChild(t);updateClock()}}};
function updateClock(){let t=document.getElementById('clock');if(!t||!quiz?.deadline)return;let sec=Math.max(0,Math.ceil((quiz.deadline-Date.now())/1000));t.textContent=`Pozostało ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
